<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<title>AsiaWX - Asian weather analysis</title>
<meta name="description" content="Model forecasts, wind fields, satellite and tropical cyclone information for Asia and the Western Pacific, with the source, model run and valid time shown for every dataset.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230f1a24'/%3E%3Cpath d='M2.5 6h7a2 2 0 1 0-2-2M2.5 10h9a2 2 0 1 1-2 2' fill='none' stroke='%236ec1ff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
<main id="mapwrap">
<div id="map" role="application" aria-label="Map of Asia with wind field"></div>
<canvas id="wind" aria-hidden="true"></canvas>
<div id="tip" aria-live="off" hidden></div>
</main>
<header id="bar">
<div class="grp">
<div class="search">
<svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg>
<input id="q" type="search" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" autocomplete="off" placeholder="Search place" aria-label="Search place or coordinates">
<button id="locate" type="button" class="bare" aria-label="Use my location" title="Use my location"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22"/></svg></button>
<ul id="results" role="listbox" hidden></ul>
</div>
<button id="zin" type="button" class="rb zoom" aria-label="Zoom in" title="Zoom in"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4M11 8v6M8 11h6"/></svg></button>
<button id="zout" type="button" class="rb zoom" aria-label="Zoom out" title="Zoom out"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4M8 11h6"/></svg></button>
<button id="menubtn" type="button" class="rb" aria-label="Layers" aria-expanded="true" aria-controls="menu" title="Layers"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 12.5 9 5 9-5"/><path d="m3 16.5 9 5 9-5"/></svg></button>
<button id="fit" type="button" class="rb zoom" aria-label="Fit to Asia" title="Fit to Asia"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="2"/></svg></button>
</div>
<div class="grp">
<button id="tz" type="button" class="pillb" aria-label="Time zone: UTC. Activate to switch" title="Switch UTC / local time">UTC</button>
<button id="full" type="button" class="rb fs" aria-label="Toggle fullscreen" title="Fullscreen"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button>
<button id="infobtn" type="button" class="rb" aria-label="Data, sources and decoder" aria-haspopup="dialog" title="Data and sources"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg></button>
</div>
</header>
<nav id="menu" aria-label="Map layers">
<div class="sheet-h"><b>Layers</b><button id="mclose" type="button" class="rb sm" aria-label="Close layers"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
<div id="p-lay" class="stack"></div>
</nav>
<aside id="card" aria-label="Forecast and storms" hidden>
<div class="card-top">
<div role="tablist" id="ctabs" aria-label="Forecast or storms">
<button role="tab" id="t-loc" aria-controls="p-loc" aria-selected="true" type="button">Forecast</button>
<button role="tab" id="t-tc" aria-controls="p-tc" aria-selected="false" type="button" tabindex="-1">Storms</button>
</div>
<button id="cclose" type="button" class="rb sm" aria-label="Close panel"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</div>
<section id="p-loc" role="tabpanel" aria-labelledby="t-loc" tabindex="0"></section>
<section id="p-tc" role="tabpanel" aria-labelledby="t-tc" tabindex="0" hidden></section>
</aside>
<div id="status" role="status" aria-live="polite"></div>
<footer id="dock">
<div id="tl-time" aria-live="off"></div>
<button id="play" type="button" class="playb" aria-label="Play timeline"></button>
<div class="stepb"><button id="prev" type="button" class="rb sm" aria-label="Previous step"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button><button id="next" type="button" class="rb sm" aria-label="Next step"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button></div>
<div id="track"><div id="ticks" aria-hidden="true"></div><div id="marker" aria-hidden="true"></div><input id="slider" type="range" min="0" max="0" value="0" step="1" aria-label="Timeline position" disabled></div>
<div class="dock-r"><button id="now" type="button" class="pillb">Now</button><label class="sel"><span class="vh">Playback speed</span><select id="speed" aria-label="Playback speed"><option value="800">1x</option><option value="400">2x</option><option value="200">4x</option></select></label></div>
</footer>
<div id="legend" aria-label="Wind speed legend" hidden></div>
<div id="info" class="modal" hidden>
<div class="scrim" data-close="1"></div>
<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="info-t" tabindex="-1">
<div class="dlg-h"><div><h2 id="info-t">Data and sources</h2><div class="cap">Where every layer comes from and how it is decoded</div></div><button id="iclose" type="button" class="rb sm" aria-label="Close"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
<div role="tablist" id="itabs" aria-label="Information">
<button role="tab" id="t-src" aria-controls="p-src" aria-selected="true" type="button">Sources</button>
<button role="tab" id="t-dec" aria-controls="p-dec" aria-selected="false" type="button" tabindex="-1">Decoder</button>
</div>
<section id="p-src" role="tabpanel" aria-labelledby="t-src" tabindex="0"></section>
<section id="p-dec" role="tabpanel" aria-labelledby="t-dec" tabindex="0" hidden></section>
</div>
</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
